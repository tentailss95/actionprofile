name: Build WF
on:
  # push:
  #   branches:
  #     - main

  pull_request:
    branches:
      - main
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn clean install -DskipTests
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maven Test on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle